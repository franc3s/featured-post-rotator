name: Bug report
description: Something doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: For security problems, don't use this form. See the Security tab instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Rotazione Articoli → …
        2. Click …
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "1.22.4"
    validations:
      required: true
  - type: input
    id: wp-version
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
  - type: input
    id: slots
    attributes:
      label: Number of slots
  - type: dropdown
    id: trigger
    attributes:
      label: How was the rotation started?
      options:
        - Not related to a rotation
        - Automatic (cron)
        - Manual ("Esegui ora")
        - Candidate tour or priority page
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: PHP errors, browser console errors or entries from the rotation history.
      render: text
